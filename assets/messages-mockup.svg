<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="13">
  <defs>
    <linearGradient id="meBubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2891ff"/>
      <stop offset="100%" stop-color="#0a7cff"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="3" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Telegram source badge (paper plane) -->
    <symbol id="tg" viewBox="0 0 20 20">
      <circle cx="10" cy="10" r="10" fill="#229ED9"/>
      <path d="M4.6 9.9 L15.2 5.6 L13.3 15 L10.2 12.3 L8.5 13.9 L8.2 11.1 Z" fill="#ffffff"/>
    </symbol>
  </defs>

  <style>
    .winbg     { fill: #ffffff; }
    .sidebar   { fill: #f5f5f7; }
    .pane      { fill: #ffffff; }
    .border    { stroke: #d5d5da; stroke-width: 1; fill: none; }
    .softborder{ stroke: #ececee; stroke-width: 1; fill: none; }
    .fg        { fill: #1d1d1f; }
    .onblue    { fill: #ffffff; }
    .muted     { fill: #86868b; }
    .dim       { fill: #aeaeb2; }
    .accent    { fill: #0a7cff; }
    .green     { fill: #34c759; }
    .titlebar  { fill: #ececee; }
    .selected  { fill: #e4efff; }
    .input     { fill: #ececed; }
    .themBubble{ fill: #e9e9eb; }
    .heart     { fill: #ff375f; }
    .badge     { fill: #0a7cff; }
    .focusBar  { fill: #0a7cff; }
    .strong    { font-weight: 600; }
    .bold      { font-weight: 700; }
  </style>

  <!-- window -->
  <rect class="winbg" width="1200" height="720" rx="12" ry="12"/>

  <!-- title bar -->
  <rect class="titlebar" x="0" y="0" width="1200" height="32" rx="12"/>
  <rect class="titlebar" x="0" y="20" width="1200" height="12"/>
  <circle cx="20" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="16" r="6" fill="#febc2e"/>
  <circle cx="60" cy="16" r="6" fill="#28c840"/>
  <text x="600" y="20" text-anchor="middle" class="muted strong">Messages</text>

  <!-- sidebar -->
  <rect class="sidebar" x="0" y="32" width="320" height="688"/>
  <line class="border" x1="320" y1="32" x2="320" y2="720"/>

  <!-- sidebar header -->
  <text x="20" y="64" class="fg bold" font-size="16">Messages</text>
  <!-- new message icon -->
  <circle cx="290" cy="58" r="14" fill="#e6e6e9"/>
  <text x="290" y="63" text-anchor="middle" class="fg" font-size="14">✎</text>

  <!-- search box -->
  <rect class="input" x="16" y="80" width="288" height="30" rx="8"/>
  <text x="28" y="100" class="muted">⌕  Search</text>

  <!-- connection status pill -->
  <circle cx="24" cy="128" r="4" class="green"/>
  <text x="36" y="132" class="muted" font-size="11">Connected · iMessage + Telegram</text>

  <!-- chat list (unified: iMessage + Telegram, sorted by time) -->
  <!-- row 1 selected — iMessage -->
  <rect class="selected" x="0" y="148" width="320" height="64"/>
  <rect class="focusBar" x="0" y="156" width="3" height="48" rx="1.5"/>
  <circle cx="36" cy="180" r="20" fill="#c7c7cc"/>
  <text x="36" y="185" text-anchor="middle" class="fg strong">AS</text>
  <text x="68" y="172" class="fg strong">Anna Svensson</text>
  <text x="298" y="172" text-anchor="end" class="dim" font-size="11">10:42</text>
  <text x="68" y="192" class="muted" font-size="12">Are you joining the call at 11?</text>
  <circle cx="298" cy="194" r="9" class="badge"/>
  <text x="298" y="198" text-anchor="middle" class="onblue bold" font-size="10">2</text>
  <line class="softborder" x1="0" y1="212" x2="320" y2="212"/>

  <!-- row 2 — Telegram -->
  <circle cx="36" cy="244" r="20" fill="#c7c7cc"/>
  <text x="36" y="249" text-anchor="middle" class="fg strong">SB</text>
  <use href="#tg" x="44" y="252" width="16" height="16"/>
  <text x="68" y="236" class="fg strong">Sofia Berg</text>
  <text x="298" y="236" text-anchor="end" class="dim" font-size="11">10:31</text>
  <text x="68" y="256" class="muted" font-size="12">skickar bilderna nu 📸</text>
  <line class="softborder" x1="0" y1="276" x2="320" y2="276"/>

  <!-- row 3 — iMessage -->
  <circle cx="36" cy="308" r="20" fill="#c7c7cc"/>
  <text x="36" y="313" text-anchor="middle" class="fg strong">MK</text>
  <text x="68" y="300" class="fg strong">Mom &amp; Kids</text>
  <text x="298" y="300" text-anchor="end" class="dim" font-size="11">09:18</text>
  <text x="68" y="320" class="muted" font-size="12">Liam: see you tonight ❤️</text>
  <line class="softborder" x1="0" y1="340" x2="320" y2="340"/>

  <!-- row 4 — Telegram group, typing -->
  <circle cx="36" cy="372" r="20" fill="#c7c7cc"/>
  <text x="36" y="377" text-anchor="middle" class="fg strong">DT</text>
  <use href="#tg" x="44" y="380" width="16" height="16"/>
  <text x="68" y="364" class="fg strong">Dev Team</text>
  <text x="298" y="364" text-anchor="end" class="dim" font-size="11">09:05</text>
  <text x="68" y="384" class="accent" font-size="12" font-style="italic">Alex is typing…</text>
  <line class="softborder" x1="0" y1="404" x2="320" y2="404"/>

  <!-- row 5 — iMessage, unread -->
  <circle cx="36" cy="436" r="20" fill="#c7c7cc"/>
  <text x="36" y="441" text-anchor="middle" class="fg strong">EL</text>
  <text x="68" y="428" class="fg strong">Erik Lindqvist</text>
  <text x="298" y="428" text-anchor="end" class="dim" font-size="11">Yesterday</text>
  <text x="68" y="448" class="muted" font-size="12">sounds good, ttyl</text>
  <line class="softborder" x1="0" y1="468" x2="320" y2="468"/>

  <!-- row 6 — Telegram -->
  <circle cx="36" cy="500" r="20" fill="#c7c7cc"/>
  <text x="36" y="505" text-anchor="middle" class="fg strong">PK</text>
  <use href="#tg" x="44" y="508" width="16" height="16"/>
  <text x="68" y="492" class="fg strong">Pavel K.</text>
  <text x="298" y="492" text-anchor="end" class="dim" font-size="11">Sun</text>
  <text x="68" y="512" class="muted" font-size="12">Your login code: 51829</text>

  <!-- footer in sidebar -->
  <line class="border" x1="0" y1="688" x2="320" y2="688"/>
  <text x="20"  y="708" class="muted" font-size="11">⚙ Settings</text>
  <text x="180" y="708" class="muted" font-size="11">☼  Theme</text>
  <text x="298" y="708" text-anchor="end" class="muted" font-size="11">v0.2.2</text>

  <!-- main: split into panes -->
  <!-- pane 1 (left) - active iMessage -->
  <rect class="pane" x="320" y="32" width="500" height="688"/>
  <line class="border" x1="820" y1="32" x2="820" y2="720"/>

  <!-- pane 1 header -->
  <rect class="titlebar" x="320" y="32" width="500" height="44"/>
  <line class="border" x1="320" y1="76" x2="820" y2="76"/>
  <circle cx="350" cy="54" r="14" fill="#c7c7cc"/>
  <text x="350" y="58" text-anchor="middle" class="fg strong" font-size="11">AS</text>
  <text x="372" y="58" class="fg strong">Anna Svensson</text>
  <text x="800" y="58" text-anchor="end" class="muted">⊞  ⋯</text>

  <!-- pane 1 messages (iMessage style) -->
  <text x="570" y="100" text-anchor="middle" class="dim" font-size="11">Today 10:36</text>

  <!-- them bubble -->
  <rect class="themBubble" x="340" y="116" width="284" height="34" rx="16"/>
  <text x="356" y="138" class="fg">Hey! morning ☀️ how was the demo?</text>

  <rect class="themBubble" x="340" y="160" width="240" height="34" rx="16"/>
  <text x="356" y="182" class="fg">did the new build hold up?</text>
  <text x="340" y="208" class="dim" font-size="11">Anna · 10:36</text>

  <!-- me bubble -->
  <rect fill="url(#meBubble)" x="500" y="226" width="300" height="34" rx="16"/>
  <text x="788" y="248" text-anchor="end" class="onblue">went smoothly, almost zero crashes 🎉</text>

  <rect fill="url(#meBubble)" x="500" y="270" width="300" height="56" rx="16"/>
  <text x="788" y="292" text-anchor="end" class="onblue">they want a follow-up next week to look</text>
  <text x="788" y="312" text-anchor="end" class="onblue">at the streaming side</text>

  <!-- tapback heart on me bubble -->
  <circle cx="490" cy="232" r="11" fill="#ffffff" stroke="#e0e0e3"/>
  <text x="490" y="237" text-anchor="middle" class="heart" font-size="11">♥</text>

  <text x="788" y="338" text-anchor="end" class="dim" font-size="11">Delivered · Read 10:39</text>

  <!-- them with reply / link preview -->
  <rect class="themBubble" x="340" y="356" width="380" height="34" rx="16"/>
  <text x="356" y="378" class="fg">nice, sending the recording link 👇</text>

  <!-- link preview card -->
  <rect x="340" y="402" width="360" height="78" rx="14" fill="#f2f2f4" stroke="#e4e4e7" filter="url(#cardShadow)"/>
  <rect x="340" y="402" width="80" height="78" rx="14" fill="#d3d3d8"/>
  <text x="380" y="448" text-anchor="middle" class="muted" font-size="22">▶</text>
  <text x="432" y="424" class="fg strong">Demo recording — Q2 review</text>
  <text x="432" y="442" class="muted" font-size="11">notes.studio.local · 18 min</text>
  <text x="432" y="464" class="dim" font-size="11">Shared link preview, fetched locally</text>

  <text x="340" y="498" class="dim" font-size="11">Anna · 10:41</text>

  <!-- typing indicator -->
  <rect class="themBubble" x="340" y="520" width="64" height="28" rx="14"/>
  <circle cx="358" cy="534" r="3" class="muted"/>
  <circle cx="372" cy="534" r="3" class="muted"/>
  <circle cx="386" cy="534" r="3" class="muted"/>

  <!-- pane 1 input -->
  <line class="border" x1="320" y1="652" x2="820" y2="652"/>
  <rect class="input" x="340" y="666" width="420" height="36" rx="18"/>
  <text x="376" y="690" class="muted">iMessage</text>
  <circle cx="788" cy="684" r="16" class="accent"/>
  <text x="788" y="689" text-anchor="middle" class="onblue bold">↑</text>
  <text x="350" y="688" class="muted" font-size="14">＋</text>

  <!-- pane 2 (top right) — Telegram -->
  <rect class="pane" x="820" y="32" width="380" height="344"/>

  <!-- pane 2 header -->
  <rect class="titlebar" x="820" y="32" width="380" height="44"/>
  <line class="border" x1="820" y1="76" x2="1200" y2="76"/>
  <circle cx="850" cy="54" r="14" fill="#c7c7cc"/>
  <text x="850" y="58" text-anchor="middle" class="fg strong" font-size="11">SB</text>
  <use href="#tg" x="857" y="55" width="15" height="15"/>
  <text x="872" y="58" class="fg strong">Sofia Berg</text>
  <text x="1120" y="58" class="green" font-size="11">online</text>
  <text x="1180" y="58" text-anchor="end" class="muted">⋯  ✕</text>

  <text x="1010" y="100" text-anchor="middle" class="dim" font-size="11">Today 10:28</text>

  <rect class="themBubble" x="840" y="116" width="250" height="34" rx="16"/>
  <text x="856" y="138" class="fg">hittade de gamla studiobilderna!</text>

  <rect fill="url(#meBubble)" x="900" y="160" width="280" height="34" rx="16"/>
  <text x="1168" y="182" text-anchor="end" class="onblue">åh vad kul, skicka gärna 🙌</text>

  <!-- attachment thumb -->
  <rect x="840" y="200" width="160" height="100" rx="16" fill="#d3d3d8"/>
  <text x="920" y="252" text-anchor="middle" class="muted" font-size="26">🖼</text>
  <text x="920" y="284" text-anchor="middle" class="muted" font-size="10">studio_2019.jpg · 1.2 MB</text>
  <!-- reaction on the photo -->
  <circle cx="988" cy="300" r="11" fill="#ffffff" stroke="#e0e0e3"/>
  <text x="988" y="305" text-anchor="middle" font-size="11">😍</text>

  <!-- pane 2 input -->
  <line class="border" x1="820" y1="320" x2="1200" y2="320"/>
  <rect class="input" x="840" y="332" width="300" height="32" rx="16"/>
  <text x="876" y="353" class="muted">Message</text>
  <circle cx="1168" cy="348" r="14" class="accent"/>
  <text x="1168" y="353" text-anchor="middle" class="onblue bold">↑</text>
  <text x="850" y="352" class="muted" font-size="14">＋</text>

  <!-- horizontal split divider -->
  <line class="border" x1="820" y1="376" x2="1200" y2="376"/>

  <!-- pane 3 (bottom right) — Telegram group -->
  <rect class="pane" x="820" y="376" width="380" height="344"/>

  <!-- pane 3 header -->
  <rect class="titlebar" x="820" y="376" width="380" height="44"/>
  <line class="border" x1="820" y1="420" x2="1200" y2="420"/>
  <circle cx="850" cy="398" r="14" fill="#c7c7cc"/>
  <text x="850" y="402" text-anchor="middle" class="fg strong" font-size="11">DT</text>
  <use href="#tg" x="857" y="399" width="15" height="15"/>
  <text x="872" y="402" class="fg strong">Dev Team</text>
  <text x="1120" y="402" class="muted" font-size="11">14 members</text>
  <text x="1180" y="402" text-anchor="end" class="muted">⋯  ✕</text>

  <text x="1010" y="444" text-anchor="middle" class="dim" font-size="11">Today 09:01</text>

  <rect class="themBubble" x="840" y="460" width="230" height="34" rx="16"/>
  <text x="856" y="482" class="fg">merged the video streaming fix ✅</text>
  <text x="840" y="506" class="dim" font-size="11">Kim · 09:01</text>

  <rect fill="url(#meBubble)" x="940" y="518" width="240" height="34" rx="16"/>
  <text x="1168" y="540" text-anchor="end" class="onblue">nice, testing on the M3 now</text>

  <rect class="themBubble" x="840" y="562" width="64" height="28" rx="14"/>
  <circle cx="858" cy="576" r="3" class="muted"/>
  <circle cx="872" cy="576" r="3" class="muted"/>
  <circle cx="886" cy="576" r="3" class="muted"/>
  <text x="840" y="606" class="dim" font-size="11">Alex is typing…</text>

  <!-- pane 3 input -->
  <line class="border" x1="820" y1="652" x2="1200" y2="652"/>
  <rect class="input" x="840" y="666" width="300" height="36" rx="18"/>
  <text x="876" y="690" class="muted">Message</text>
  <circle cx="1168" cy="684" r="16" fill="#d3d3d8"/>
  <text x="1168" y="689" text-anchor="middle" class="muted bold">↑</text>
  <text x="850" y="688" class="muted" font-size="14">＋</text>
</svg>
