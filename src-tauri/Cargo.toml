[package]
name = "app"
version = "0.2.4"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.0", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-http = "2.5.9"
tauri-plugin-websocket = "2"

# Telegram backend (self-contained MTProto/SQLite core) wired into the app.
telegram-core = { workspace = true }
shared = { workspace = true }
cache = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.11.0", features = ["macos-private-api"] }
keyring = { version = "3.6.2", features = ["apple-native"] }
window-vibrancy = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.2", features = ["linux-native"] }
